<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Kontaktiere Karina für eure Hochzeitsfotografie.">
  <title>Kontakt – Karina</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='serif' font-size='48' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">
  <script>if ("IntersectionObserver" in window) document.documentElement.classList.add("has-scroll-reveal");</script>
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding: 32px 6.1vw;
    }

    .wordmark {
      font-family: "Viaoda Libre", serif;
      font-size: 23px;
      line-height: 1;
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3.6vw, 54px);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    nav a { transition: opacity 180ms ease; }
    nav a:hover { opacity: 0.65; }
    nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }

    main {
      width: min(620px, calc(100% - 44px));
      margin: 0 auto;
      padding: clamp(58px, 11vh, 112px) 0 64px;
      text-align: center;
      animation: arrive 800ms ease both;
    }

    h1 {
      margin: 0;
      font-family: "Viaoda Libre", serif;
      font-size: clamp(56px, 9vw, 88px);
      font-weight: 400;
      line-height: 1;
    }

    .invitation {
      margin: 12px 0 54px;
      font-family: "Pinyon Script", cursive;
      font-size: clamp(31px, 5vw, 43px);
      font-style: italic;
      line-height: 1.2;
    }

    form {
      display: grid;
      gap: 31px;
      text-align: left;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--white);
      border-radius: 0;
      padding: 15px 0;
      background: transparent;
      color: var(--white);
      font: 400 15px/1.5 "DM Sans", sans-serif;
      caret-color: var(--white);
      outline: none;
      box-shadow: none;
    }

    input::placeholder,
    textarea::placeholder { color: rgba(255, 255, 255, 0.55); opacity: 1; }

    input:focus,
    textarea:focus {
      color: var(--white);
      border-bottom-color: var(--white);
    }

    textarea {
      min-height: 126px;
      resize: vertical;
    }

    .submit-button {
      justify-self: center;
      min-width: 190px;
      margin-top: 12px;
      border: 1px solid var(--white);
      padding: 15px 27px;
      background: var(--white);
      color: var(--black);
      font: 500 11px/1.2 "DM Sans", sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: var(--black);
      color: var(--white);
    }

    .submit-button:focus-visible,
    .instagram-link:focus-visible { outline: 1px solid var(--white); outline-offset: 5px; }

    .form-status {
      margin: -12px 0 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .form-status[hidden] { display: none; }

    .instagram-link {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      margin-top: 53px;
      color: var(--white);
      transition: opacity 180ms ease;
    }

    .instagram-link:hover { opacity: 0.65; }
    .instagram-link svg { display: block; width: 21px; height: 21px; }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      display: grid;
      width: 46px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--white);
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      cursor: pointer;
      transition: opacity 240ms ease, transform 240ms ease, background-color 180ms ease, color 180ms ease, visibility 240ms;
    }

    .back-to-top.is-visible { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
    .back-to-top:hover { background: var(--black); color: var(--white); transform: translateY(-3px); }
    .back-to-top:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
    .back-to-top svg { display: block; width: 19px; height: 19px; }

    html.has-scroll-reveal .scroll-reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 700ms ease, transform 700ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    html.has-scroll-reveal .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .page-header { align-items: flex-start; flex-direction: column; gap: 24px; padding: 25px 22px; }
      nav { width: 100%; justify-content: space-between; gap: 12px; font-size: 9px; letter-spacing: 0.08em; }
      main { padding-top: 48px; padding-bottom: 48px; }
      .invitation { margin-bottom: 43px; }
      form { gap: 26px; }
      .instagram-link { margin-top: 43px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a class="wordmark" href="index.html" aria-label="Karina, Startseite">Karina</a>
    <nav aria-label="Hauptnavigation">
      <a href="index.html">Startseite</a>
      <a href="gallery.html">Galerie</a>
      <a href="about.html">Über mich</a>
      <a href="contact.html" aria-current="page">Kontakt</a>
    </nav>
  </header>

  <main>
    <h1 class="scroll-reveal">Kontakt</h1>
    <p class="invitation scroll-reveal">Erzählt mir von eurem Tag</p>

    <form id="contact-form">
      <label class="visually-hidden" for="name">Dein Name</label>
      <input id="name" name="name" type="text" placeholder="Dein Name" autocomplete="name" required>

      <label class="visually-hidden" for="email">Deine E-Mail-Adresse</label>
      <input id="email" name="email" type="email" placeholder="Deine E-Mail-Adresse" autocomplete="email" required>

      <label class="visually-hidden" for="message">Deine Nachricht</label>
      <textarea id="message" name="message" placeholder="Deine Nachricht" required></textarea>

      <button class="submit-button" type="submit">Nachricht senden</button>
      <p class="form-status" id="form-status" role="status" tabindex="-1" hidden>Vielen Dank. Ich melde mich bald.</p>
    </form>

    <a class="instagram-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram öffnen">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5" stroke="currentColor" stroke-width="1.7" />
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />
        <circle cx="17.8" cy="6.4" r="1.1" fill="currentColor" />
      </svg>
    </a>
  </main>

  <script>
    const revealElements = document.querySelectorAll(".scroll-reveal");
    if ("IntersectionObserver" in window) {
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -4% 0px" });
      revealElements.forEach(element => revealObserver.observe(element));
    } else {
      revealElements.forEach(element => element.classList.add("is-visible"));
    }

    const contactForm = document.querySelector("#contact-form");
    const formStatus = document.querySelector("#form-status");

    contactForm.addEventListener("submit", event => {
      event.preventDefault();
      formStatus.hidden = false;
      formStatus.focus();
    });
  </script>
  <button class="back-to-top" type="button" aria-label="Zum Seitenanfang" title="Zum Seitenanfang">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
  </button>
  <script>
    const backToTopButton = document.querySelector(".back-to-top");
    const updateBackToTopVisibility = () => backToTopButton.classList.toggle("is-visible", window.scrollY >= 400);
    window.addEventListener("scroll", updateBackToTopVisibility, { passive: true });
    updateBackToTopVisibility();
    backToTopButton.addEventListener("click", () => {
      const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      window.scrollTo({ top: 0, behavior });
    });
  </script>
</body>
</html>
